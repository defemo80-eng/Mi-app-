name: Build DeFitt APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests and build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload DeFitt APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeFitt-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: defitt-v1.0.${{ github.run_number }}
          name: DeFitt APK Build #${{ github.run_number }}
          body: "APK de DeFitt compilado automáticamente 100% sin internet."
          files: app/build/outputs/apk/debug/app-debug.apk
